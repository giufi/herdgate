name: Create draft GitHub release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semantic version (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi

          if gh release view "$TAG" &>/dev/null; then
            echo "Release for $TAG already exists, skipping."
            exit 0
          fi

          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" --draft --generate-notes --prerelease
          else
            gh release create "$TAG" --draft --generate-notes
          fi
