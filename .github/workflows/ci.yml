name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        go-version: [ oldstable, stable ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Determine Go cache paths
        id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-build }}
            ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-check-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-check-

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy -v
          STATUS=$(git status --porcelain go.mod go.sum)
          if [ -n "$STATUS" ]; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' locally and commit the changes."
            echo "$STATUS"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Verify bench go.mod/go.sum are tidy
        run: |
          go -C bench mod tidy -v
          STATUS=$(git status --porcelain bench/go.mod bench/go.sum)
          if [ -n "$STATUS" ]; then
            echo "::error::bench/go.mod/go.sum are not tidy. Run 'go -C bench mod tidy' locally and commit the changes."
            echo "$STATUS"
            exit 1
          fi

      - name: Lint bench
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: bench

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        go-version: [ oldstable, stable ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Determine Go cache paths
        id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-build }}
            ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-build-

      - name: Build
        run: go build -trimpath -v ./...

      - name: Build bench
        run: go -C bench build -trimpath -v ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        go-version: [ oldstable, stable ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Determine Go cache paths
        id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-build }}
            ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-test-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-test-

      - name: Test with race detector
        run: go test -race -count=1 -v ./...

      - name: Test bench with race detector
        run: go -C bench test -race -count=1 -v ./...

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check vulnerabilities
        run: govulncheck ./...

      - name: Check bench vulnerabilities
        run: govulncheck -C bench ./...
