version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - errcheck
    - goconst
    - misspell
    - unparam
    - gocritic
    - errorlint
    - nolintlint
    - testifylint
  settings:
    gocritic:
      enabled-checks:
        - sloppyReassign
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - goimports
