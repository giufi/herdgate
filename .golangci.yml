version: "2"

run:
  timeout: 5m

linters:
  enable:
    - contextcheck
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - perfsprint
    - sloglint
    - staticcheck
    - testifylint
    - unparam
    - unused
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    sloglint:
      attr-only: true
      context: scope
      forbidden-keys:
        - time
        - level
        - msg
        - source
      msg-style: capitalized
      static-msg: true
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofumpt
    - goimports
