version: "2"

run:
  timeout: 5m

linters:
  enable:
    - contextcheck
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - perfsprint
    - sloglint
    - staticcheck
    - testifylint
    - unparam
    - unused
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    sloglint:
      attr-only: true
      context: scope
      custom-funcs:
        - name: "github.com/giufi/herdgate/internal/logging.Error"
          msg-pos: 1
          args-pos: 2
        - name: "github.com/giufi/herdgate/internal/logging.Debug"
          msg-pos: 1
          args-pos: 2
      forbidden-keys:
        - time
        - level
        - msg
        - source
      msg-style: capitalized
      static-msg: true
    staticcheck:
      checks:
        - all
  exclusions:
    rules:
      - path: 'internal/logging/logger_test\.go'
        linters:
          - sloglint
        source: 'slog\.NewTextHandler\(io\.Discard'

formatters:
  enable:
    - gofumpt
    - goimports
